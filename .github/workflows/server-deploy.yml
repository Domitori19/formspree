name: Server CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/domitori19/mcp-formspree
  SERVER_DIR: /opt/mcp/formspree

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          cp forms.example.json forms.json
          pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      HAS_SERVER_SECRETS: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}
      # Одноразовый токен этого запуска: сервер логинится в GHCR только на время pull
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Skip deploy (server secrets not configured)
        if: env.HAS_SERVER_SECRETS != 'true'
        run: echo "::warning::SERVER_HOST / SERVER_USER / SERVER_SSH_KEY не заданы — деплой пропущен"

      - name: Sync docker-compose.yml to Server
        if: env.HAS_SERVER_SECRETS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/docker-compose.yml"
          target: ${{ env.SERVER_DIR }}
          strip_components: 1

      - name: Deploy via SSH
        if: env.HAS_SERVER_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: SERVER_DIR,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$SERVER_DIR"
            test -f .env || { echo ".env не найден в $SERVER_DIR"; exit 1; }
            test -f forms.json || { echo "forms.json не найден в $SERVER_DIR"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker image prune -f
