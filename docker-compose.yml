services:
  mcp-formspree:
    build:
      context: .
    image: mcp-formspree:latest
    container_name: mcp-formspree-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./forms.json:/app/forms.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; connection = socket.create_connection(('127.0.0.1', 9090), 2); connection.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: python -m src.server --sse
