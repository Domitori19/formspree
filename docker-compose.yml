services:
  mcp-formspree:
    build:
      context: .
    image: mcp-formspree:latest
    container_name: mcp-formspree-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 9090
    ports:
      - "127.0.0.1:${HOST_PORT:-9090}:9090"
    volumes:
      - ./forms.json:/app/forms.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: python -m src.server --http
